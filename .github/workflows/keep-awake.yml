# Paused for a few minutes: the running server is stuck and must fall asleep once so it restarts clean.
# This only cancels the visitor runs that are still going. The full version comes back right after.
name: keep bot awake
on:
  push:
    branches: [main]
jobs:
  stop-visits:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: keep-awake
      cancel-in-progress: true
    steps:
      - run: echo "visits paused"
