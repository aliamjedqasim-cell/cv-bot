# Free outside visitor for the Render free plan:
# - every 5 minutes it opens the bot's page so the server never falls asleep
# - after every update pushed to main, it asks the bot to deploy the new version (/sync)
name: keep bot awake
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Visit the bot
        run: curl -sS -m 120 -o /dev/null -w "%{http_code}\n" https://cv-bot-o61r.onrender.com/ || true
      - name: Deploy the new version after a push
        if: github.event_name == 'push'
        run: |
          sleep 15
          curl -sS -m 120 "https://cv-bot-o61r.onrender.com/sync?run=${{ github.run_id }}" || true
