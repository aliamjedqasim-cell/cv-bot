services:
  - type: web
    name: cv-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: QI_CARD_NAME
        sync: false
      - key: QI_CARD_NUMBER
        sync: false
      - key: PRICE_IQD
        value: "25000"
      - key: WEBHOOK_SECRET
        generateValue: true
